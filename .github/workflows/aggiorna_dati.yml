name: Aggiorna dati Fantacalcio

# Aggiorna quotazioni + statistiche + infortuni + dataset unificato, committa su
# main se qualcosa e' cambiato, e infine genera e invia via email la lista Excel.

on:
  schedule:
    # cron in UTC. 07:53 UTC = 09:53 in Italia d'estate (CEST) / 08:53 d'inverno (CET).
    # GitHub non gestisce l'ora legale: da fine ottobre l'orario italiano sara' 08:53
    # (per riavere le 09:53 in inverno, cambiare in "53 8 * * *").
    #
    # Minuto non tondo (53 invece di 00) DI PROPOSITO: GitHub Actions esegue gli
    # schedule "best effort" e avvisa che i ritardi sono piu' probabili proprio
    # a inizio ora (":00"), il momento piu' affollato su tutta la piattaforma.
    # Il 27-28/08/2026 il trigger e' scattato con ~10-12 ore di ritardo (verso
    # le 20:30/21:40 CEST invece che alle 10:00) mentre era impostato su "0 8 * * *":
    # spostare il minuto e' la mitigazione standard consigliata da GitHub.
    - cron: "53 7 * * *"
  workflow_dispatch: {}   # avvio manuale dalla tab Actions (per testarlo subito)

# serve per far pushare il commit automatico con il token integrato GITHUB_TOKEN
permissions:
  contents: write

# evita esecuzioni sovrapposte
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Gli script di estrazione usano solo la stdlib; per l'Excel serve openpyxl.
      - name: Installa dipendenze (openpyxl)
        run: pip install openpyxl

      # Gli step girano in ordine. Se uno fallisce (es. il sito cambia
      # struttura o non risponde), il job si ferma qui e risulta FALLITO
      # (X rossa) -> GitHub ti invia la notifica. Nessun retry aggressivo:
      # una sola richiesta per esecuzione, coerente con l'uso ~1 volta/giorno.
      - name: 1) Estrai quotazioni
        run: python3 scripts/estrai_quotazioni.py

      - name: 2) Estrai statistiche (3 stagioni)
        run: python3 scripts/estrai_statistiche.py

      - name: 3) Estrai infortuni/indisponibili
        run: python3 scripts/estrai_infortuni.py

      - name: 4) Unisci dataset
        run: python3 scripts/unisci_dataset.py

      # Nota: data/classifiche_squadre.csv e' un file statico (classifiche finali
      # da Wikipedia), non generato da uno script: non va rigenerato qui.

      - name: 5) Commit & push se i dati sono cambiati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Nessuna modifica ai dati: nessun commit."
          else
            echo "Dati cambiati: committo e pusho."
            git add data/
            git commit -m "Aggiornamento automatico dati ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Genera la lista Excel e la invia via email (sempre, anche se i dati non
      # sono cambiati). Se manca un secret o l'invio fallisce, il job va in
      # errore -> notifica GitHub. Usa il dataset appena rigenerato su disco.
      - name: 6) Genera e invia la lista via email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 scripts/invia_report.py

      # Pubblica dati.json nella ROOT di questo stesso repo (ora pubblico, Pages
      # attivo). Nessun PAT/secret necessario: il GITHUB_TOKEN implicito basta,
      # come per lo step 5. Stessa cartella dell'index.html gia' servito da Pages,
      # cosi' il file e' raggiungibile su .../dati.json accanto alla pagina.
      - name: 7) Pubblica dati.json (GitHub Pages, stesso repo)
        run: |
          python3 scripts/genera_json.py --out dati.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati.json
          if git diff --cached --quiet; then
            echo "JSON invariato: nessun commit."
          else
            git commit -m "Aggiorna dati.json pubblico ($(date -u +%Y-%m-%d))"
            git push
          fi
