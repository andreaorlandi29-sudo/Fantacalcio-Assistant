<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dati Fantacalcio (pubblici)</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:680px;
       margin:40px auto;padding:0 16px;line-height:1.5;color:#1a1a1a}
  code{background:#f0f0f3;padding:2px 6px;border-radius:5px}
  a{color:#1f4e78}
  .meta{color:#555;font-size:.95rem}
</style>
</head>
<body>
  <h1>Dati Fantacalcio — endpoint pubblico</h1>
  <p>Questo sito serve un solo file di dati, aggiornato automaticamente:</p>
  <p><a id="link" href="dati.json"><code>dati.json</code></a></p>
  <p class="meta" id="meta">Caricamento metadati…</p>
  <p class="meta">Solo dati dei giocatori (quotazioni, statistiche, infortuni). Nessun
     codice o strategia: quelli restano in un repository privato separato.</p>
  <script>
    fetch('dati.json', {cache:'no-store'})
      .then(r => r.json())
      .then(d => {
        document.getElementById('meta').textContent =
          `Aggiornato il ${d.aggiornato_il} · ${d.totale} giocatori · stagioni ${d.stagioni.join(', ')}`;
      })
      .catch(() => { document.getElementById('meta').textContent =
          'dati.json non ancora disponibile (verrà creato al primo aggiornamento).'; });
  </script>
</body>
</html>
